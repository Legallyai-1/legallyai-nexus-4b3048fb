name: Deploy to Vercel

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # Manual trigger for secret sync

jobs:
  # Sync secrets to Vercel
  sync-secrets:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Sync production secrets to Vercel
        uses: itstor/sync-secrets-to-vercel@v1
        with:
          prefix: 'VITE_'
          environments: 'production,preview'
          project: ${{ secrets.VERCEL_PROJECT_ID }}
          team_id: ${{ secrets.VERCEL_ORG_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}
          secrets: '${{ toJSON(secrets) }}'
          cancel_on_fail: false

  # Deploy to Vercel
  deploy:
    runs-on: ubuntu-latest
    needs: [sync-secrets]
    if: always() && (needs.sync-secrets.result == 'success' || needs.sync-secrets.result == 'skipped')
    env:
      VITE_ENABLE_PAYMENTS: 'true'
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: npm run build

      - name: Skip Vercel preview deployment when secrets are unavailable
        if: github.event_name == 'pull_request' && (env.VERCEL_TOKEN == '' || env.VERCEL_ORG_ID == '' || env.VERCEL_PROJECT_ID == '')
        run: echo "Skipping Vercel preview deployment because required Vercel secrets are unavailable for this pull_request run."

      - name: Configure server-side Vercel variables
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$SUPABASE_URL" && test -n "$SUPABASE_SECRET_KEY" && test -n "$STRIPE_SECRET_KEY" && test -n "$STRIPE_WEBHOOK_SECRET" || { echo 'Required Vercel/Supabase/Stripe deployment secret is missing'; exit 1; }
          npm exec --yes --package=vercel@59.17.0 -- vercel env rm SUPABASE_URL production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes >/dev/null 2>&1 || true
          npm exec --yes --package=vercel@59.17.0 -- vercel env rm SUPABASE_SECRET_KEY production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes >/dev/null 2>&1 || true
          npm exec --yes --package=vercel@59.17.0 -- vercel env rm SUPABASE_SERVICE_ROLE_KEY production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes >/dev/null 2>&1 || true
          npm exec --yes --package=vercel@59.17.0 -- vercel env rm STRIPE_SECRET_KEY production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes >/dev/null 2>&1 || true
          npm exec --yes --package=vercel@59.17.0 -- vercel env rm STRIPE_WEBHOOK_SECRET production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" --yes >/dev/null 2>&1 || true
          printf '%s' "$SUPABASE_URL" | npm exec --yes --package=vercel@59.17.0 -- vercel env add SUPABASE_URL production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/dev/null
          printf '%s' "$SUPABASE_SECRET_KEY" | npm exec --yes --package=vercel@59.17.0 -- vercel env add SUPABASE_SECRET_KEY production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/dev/null
          printf '%s' "$STRIPE_SECRET_KEY" | npm exec --yes --package=vercel@59.17.0 -- vercel env add STRIPE_SECRET_KEY production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/dev/null
          printf '%s' "$STRIPE_WEBHOOK_SECRET" | npm exec --yes --package=vercel@59.17.0 -- vercel env add STRIPE_WEBHOOK_SECRET production --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID" >/dev/null

      - name: Deploy to Vercel
        if: github.event_name != 'pull_request' || (env.VERCEL_TOKEN != '' && env.VERCEL_ORG_ID != '' && env.VERCEL_PROJECT_ID != '')
        uses: amondnet/vercel-action@v25
        id: vercel-deploy
        with:
          vercel-token: ${{ env.VERCEL_TOKEN }}
          vercel-org-id: ${{ env.VERCEL_ORG_ID }}
          vercel-project-id: ${{ env.VERCEL_PROJECT_ID }}
          vercel-args: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--prod' || '' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-comment: ${{ github.event_name == 'pull_request' }}
          working-directory: ./
          alias-domains: |
            ${{ github.event_name == 'pull_request' && format('pr-{0}.legallyai-nexus.vercel.app', github.event.pull_request.number) || '' }}
            ${{ github.ref == 'refs/heads/main' && 'legallyai-nexus.vercel.app' || '' }}

      - name: Comment deployment URL
        if: github.event_name == 'pull_request' && steps.vercel-deploy.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.vercel-deploy.outputs.preview-url }}';
            const deploymentState = 'READY';
            const deploymentName = '${{ steps.vercel-deploy.outputs.preview-name }}';
            
            const comment = `## 🚀 Vercel Deployment
            
            Your PR has been successfully deployed to Vercel!
            
            | Name | Link |
            |------|------|
            | 🔨 Latest commit | \`${{ github.event.pull_request.head.sha }}\` |
            | 🔍 Preview URL | [Visit Preview](https://${previewUrl}) |
            | 📝 Deployment Name | ${deploymentName} |
            | ✅ Status | ${deploymentState || 'READY'} |
            
            ---
            *Powered by [Vercel](https://vercel.com) via GitHub Actions*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
