stages:
  - test
  - browser_audit

unit_and_regression_tests:
  stage: test
  image: node:22-bookworm
  script:
    - npm ci --ignore-scripts --no-audit --no-fund
    - node --experimental-strip-types --test scripts/auth-validation.test.ts scripts/auth-redirect.test.ts scripts/billing-ownership.test.ts scripts/stripe-webhook.test.ts scripts/stripe-webhook-boundaries.test.ts
    - node --test scripts/legal-chat-protocol.test.mjs scripts/legal-knowledge.test.mjs scripts/free-ai-engine.test.mjs scripts/lee-gemini.test.mjs
    - npm run build

interactive_login_audit:
  stage: browser_audit
  image: mcr.microsoft.com/playwright:v1.56.1-noble
  script:
    - npm install --prefix "$CI_PROJECT_DIR/.playwright-qa" --ignore-scripts --no-audit --no-fund playwright@1.56.1
    - QA_PLAYWRIGHT_PATH="$CI_PROJECT_DIR/.playwright-qa/node_modules/playwright/index.mjs" node scripts/interactive-login-audit.mjs
    - mkdir -p reports/qa
    - cp interactive-login-results/report.json reports/qa/interactive-login.json
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - interactive-login-results/
      - reports/qa/interactive-login.json
