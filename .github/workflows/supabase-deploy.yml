name: Supabase CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Preview database for PRs
  preview-database:
    if: github.event_name == 'pull_request' && vars.ENABLE_SUPABASE_PREVIEW_BRANCHES == 'true'
    runs-on: ubuntu-latest
    outputs:
      api-url: ${{ steps.supabase-branch.outputs.api_url }}
      anon-key: ${{ steps.supabase-branch.outputs.anon_key }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Supabase preview branch
        id: supabase-branch
        uses: 0xbigboss/supabase-branch-gh-action@v1
        with:
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase-project-id: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          wait-for-migrations: true
          timeout: 120

      - name: Comment PR with preview database info
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## 🗄️ Supabase Preview Database
            
            A preview database has been created for this PR!
            
            | Property | Value |
            |----------|-------|
            | 🔗 API URL | \`${{ steps.supabase-branch.outputs.api_url }}\` |
            | 📊 GraphQL | \`${{ steps.supabase-branch.outputs.graphql_url }}\` |
            | 🔑 Database | \`${{ steps.supabase-branch.outputs.db_host }}\` |
            
            This preview database will be automatically cleaned up when the PR is closed.`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Build and deploy
  build-and-deploy:
    runs-on: ubuntu-latest
    needs: [preview-database]
    if: always() && (needs.preview-database.result == 'success' || needs.preview-database.result == 'skipped')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build application
        env:
          # Use preview database for PRs, production for main
          VITE_SUPABASE_URL: ${{ github.event_name == 'pull_request' && needs.preview-database.outputs.api-url || vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ github.event_name == 'pull_request' && needs.preview-database.outputs.anon-key || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID || secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_ADSENSE_CLIENT_ID: ${{ vars.VITE_ADSENSE_CLIENT_ID || secrets.VITE_ADSENSE_CLIENT_ID }}
          VITE_ENABLE_ADSENSE: ${{ github.event_name == 'pull_request' && 'false' || vars.VITE_ENABLE_ADSENSE || secrets.VITE_ENABLE_ADSENSE || 'true' }}
        run: npm run build

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is required for production deployment"
            exit 1
          fi
          supabase link --project-ref ${{ secrets.VITE_SUPABASE_PROJECT_ID }}

      - name: Deploy database migrations
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: node scripts/sync-supabase-migrations.mjs

      - name: Deploy Supabase Functions
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          if [ -d "supabase/functions" ]; then
            # Set secrets for edge functions (each is a no-op if the corresponding GitHub secret is empty)
            for pair in "ANTHROPIC_API_KEY:$ANTHROPIC_API_KEY" "STRIPE_SECRET_KEY:$STRIPE_SECRET_KEY" "STRIPE_WEBHOOK_SECRET:$STRIPE_WEBHOOK_SECRET"; do
              key="${pair%%:*}"
              value="${pair#*:}"
              if [ -n "$value" ]; then
                supabase secrets set "$key=$value" --project-ref ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
              fi
            done
            
            # Deploy all functions
            for func in supabase/functions/*/; do
              if [ -f "$func/index.ts" ]; then
                func_name=$(basename "$func")
                echo "Deploying function: $func_name"
                supabase functions deploy "$func_name" --project-ref ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
              fi
            done
          else
            echo "No functions directory found, skipping..."
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'main' }}
          path: dist/
          retention-days: 7
