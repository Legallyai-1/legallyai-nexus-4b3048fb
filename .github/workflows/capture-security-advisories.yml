name: Capture actionable dependency advisories
on:
  push:
    branches: [copilot/fix-248600760-1118435113-22e2f5ad-5994-4f84-b86c-6fa9264f088c]
    paths: [.github/workflows/capture-security-advisories.yml]
permissions:
  contents: write
concurrency:
  group: capture-security-advisories
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture exact lockfile advisories without executing package scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit
          mkdir -p reports/security
          status=0
          npm audit --json > reports/security/npm-audit.json || status=$?
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('reports/security/npm-audit.json', 'utf8'));
          if (report.error || !report.metadata || !report.vulnerabilities) {
            console.error('Audit did not return a valid advisory report');
            process.exit(1);
          }
          console.log(JSON.stringify(report.metadata.vulnerabilities));
          JS
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          git add -- reports/security/npm-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: record exact dependency advisories for targeted remediation'
          git push origin HEAD:"${GITHUB_REF_NAME}"
