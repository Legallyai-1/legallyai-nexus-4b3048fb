[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Supabase-related environment variables should be configured in the
# Netlify dashboard (Site settings → Build & deploy → Environment),
# not hardcoded in this file. Ensure at least the following variables
# are defined there for builds to succeed:
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PROJECT_ID
#   VITE_SUPABASE_ANON_KEY
